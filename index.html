<!DOCTYPE html>
<html>
<head>
  <title>Text Display</title>
  <style>
    .word {
      display: inline-block;
      position: relative;
    }
    .word.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      opacity: 1;
    }
  </style>
</head>
<body>
  <textarea type="text" id="input-text" placeholder="글 입력"></textarea>
  <button onclick="displayText()">완료</button>
  <button onclick="toggleRandomWords()">랜덤 글자</button>
  <div id="text-container"></div>
  <script>
    let randomWords = [];
    let activeWords = [];

    function displayText() {
      const inputText = document.getElementById("input-text").value;
      const textContainer = document.getElementById("text-container");
      textContainer.innerHTML = "";
      const lines = inputText.split('\n');
      lines.forEach(line => {
        const words = line.split(/\s+/);
        words.forEach((word, index) => {
          const wordElement = document.createElement("div");
          wordElement.className = "word";
          wordElement.textContent = word;
          wordElement.addEventListener("click", toggleActive);
          textContainer.appendChild(wordElement);
          if (index !== words.length - 1) {
            textContainer.appendChild(document.createTextNode(" "));
          }
        });
        textContainer.appendChild(document.createElement("br"));
      });
      updateActiveWords();
    }

    function toggleActive(event) {
      const word = event.target;
      word.classList.toggle("active");
      updateActiveWords();
    }

    function toggleRandomWords() {
      const words = document.querySelectorAll(".word");
      randomWords = [];
      for (let i = 0; i < words.length; i++) {
        if (Math.random() < 0.5) {
          words[i].classList.add("active");
          randomWords.push(words[i]);
        } else {
          words[i].classList.remove("active");
        }
      }
      updateActiveWords();
    }

    function updateActiveWords() {
      activeWords = Array.from(document.querySelectorAll(".word.active"));
    }

    function revealOneWord() {
      if (activeWords.length > 0) {
        const wordToReveal = activeWords[0];
        wordToReveal.classList.remove("active");
        activeWords.shift();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        revealOneWord();
      }
    });
  </script>
</body>
</html>
